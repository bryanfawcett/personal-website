name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Type check and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Node 24.22+ here (never 25). package.json engines is >=24.18.0 because that is the Node Cloudflare's build image has.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "^24.22.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generated tokens are committed
        run: pnpm tokens --check

      - name: Generated site data is committed
        run: pnpm site-data --check

      - name: Type check
        run: pnpm exec vp run check

      - name: Build
        run: pnpm exec vp run build

      - name: Verify every self-hosted font resolves
        run: python3 scripts/verify-fonts.py

      # Links in a post body: only web, mail, phone and on-site paths; an exact own-host test.
      - name: Verify post links are safe
        run: pnpm exec vp run verify:links

      # The CMS offers exactly the palette's 21 families, generated from mzizi-tokens like the palette itself.
      - name: Adventure mineral options match the palette
        run: pnpm exec vp run seed:minerals:check

      # The blog's read path as hostile input: hostile Portable Text, dates, images, the discovery files.
      - name: Blog untrusted-input tests
        run: pnpm exec vp run test:blog
      # The EmDash publish-policy plugins: committed bundles are current (shared core compiled in), and
      # the built plugins agree with core on every language-neutral vector.
      - name: Policy plugin bundles are committed
        run: pnpm plugins:check

      - name: Policy plugin tests
        run: pnpm test:plugins

      # Two things the rendered-pixel contrast gate structurally cannot see: a
      # var() that resolves to nothing (it falls back to `unset` and inherits,
      # so there is nothing to measure), and a base rule that outranks a class
      # on specificity. The second shipped a white-on-white call to action.
      # The site's 21 colour families, dark and light, against the published
      # mzizi-tokens crate (pinned). A difference prints a table and fails.
      # The 21 families' dark and light hex are generated from mzizi-tokens, not hand-copied.
      - name: Generated palette is current
        run: pnpm exec vp run palette:check

      # The logo and favicon: public/brand/ holds the supplied vectors, `pnpm brand` renders the sizes.
      - name: Brand icons are current
        run: pnpm exec vp run brand:check

      - name: Verify the palette against mzizi-tokens
        run: pnpm exec vp run verify:palette

      - name: Verify the stylesheet
        run: pnpm exec vp run verify:stylesheet

      # The installable skill is generated from the site; fail if it has drifted.
      - name: Design-system skill is current
        run: pnpm exec vp run design-system:check

      # The header, footer and schematics are Rust; Astro inserts committed fragments.
      - name: Rust fragments are current
        run: pnpm exec vp run fragments:check

      # The theme toggle is Rust compiled to wasm and committed under src/theme/.
      - name: Theme wasm is current
        run: pnpm exec vp run theme:check

      # Hero (and whatever follows it) is called natively from .astro, as WebAssembly.
      - name: Rust WebAssembly is current
        run: pnpm exec vp run rust:wasm:check

      - name: Rust components match the built pages
        run: pnpm exec vp run verify:components:rs

      # The SEO head is rendered by mzizi-discovery in Rust; it must match what shipped before.
      - name: SEO head matches the pre-Rust head
        run: pnpm exec vp run verify:seo

  contrast:
    name: APCA contrast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "^24.22.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Served by `astro dev`, not the built Worker. This check reads rendered
      # pixels — the same components, the same CSS, the same per-request blog
      # routes — and nothing it measures depends on the Workers asset layer.
      # a built-Worker server does not survive a couple of minutes of browser-driven
      # load reliably, and a server that dies mid-run is the one failure mode a
      # gate must not have.
      #
      # `--host 127.0.0.1` is load-bearing. Left to itself Astro binds to
      # `localhost`, which on a runner resolves to ::1 — the server comes up,
      # says it is ready, and every IPv4 request to the same port is refused.
      - name: Serve the site
        run: |
          pnpm exec vp run dev --port 4321 --host 127.0.0.1 &
          npx --yes wait-on --timeout 120000 http://127.0.0.1:4321/

      # Every text block on every route, at desktop and phone width, scored
      # against the ground it is actually painted on rather than a declared
      # background-color, and held to APCA's minimum size for that contrast at
      # that weight.
      - name: Verify APCA contrast
        run: pnpm exec vp run verify:contrast

      # Text on top of text at phone and tablet sizes, both orientations.
      - name: Verify nothing overlaps on devices
        run: pnpm exec vp run verify:overlap

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "^24.22.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit
        run: pnpm audit --audit-level high
