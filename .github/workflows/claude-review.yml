name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - '**'
  issue_comment:
    types: [created]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    # Run on PR events, push events, OR when someone comments @claude on a PR
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude'))
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      # `secrets` is not available in a step-level `if`, but it is available
      # here — so the presence check has to be hoisted to a job env var.
      HAS_ANTHROPIC_CREDENTIAL: >-
        ${{ secrets.ANTHROPIC_API_KEY != ''
            || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This job has failed on every run since it was added, on every branch,
      # regardless of the diff:
      #
      #   Error: Environment variable validation failed:
      #     - Either ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN is required
      #
      # Neither secret is set on the repository, and the workflow never passed
      # either one through even if they were. Both are wired up below. The
      # credential itself has to be added in repository settings — nothing in
      # this file can supply it — so until it is, the step skips rather than
      # painting a red X on every pull request. A check that always fails is a
      # check everybody learns to ignore.
      - name: Run Claude Code Review
        if: env.HAS_ANTHROPIC_CREDENTIAL == 'true'
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Was claude-sonnet-4-20250514, retired. Even with a credential in
          # place that would have failed on an unknown model.
          model: claude-sonnet-5
          direct_prompt: |
            Review this code change and post a review comment. Analyze the changes for:

            1. **Security vulnerabilities** - XSS, injection, sensitive data exposure
            2. **Performance issues** - inefficient code, memory leaks, unnecessary re-renders
            3. **Best practices** - Astro patterns, TypeScript usage, code organization
            4. **Accessibility** - ARIA attributes, keyboard navigation, screen reader support
            5. **Type safety** - proper TypeScript types, any types to avoid

            Format your review as:
            ## Summary
            Brief overview of the changes

            ## Immediate Actions Required
            Critical issues that MUST be fixed before merge (security, bugs, breaking changes).
            Use a checkbox list: - [ ] Action item

            ## Issues Found
            List any problems (or "None" if clean)

            ## Suggestions
            Optional improvements for future consideration

            ## Verdict
            ✅ Approved / ⚠️ Changes Requested / ❌ Blocked

            Be concise and actionable. Focus on significant issues, not style nitpicks.
