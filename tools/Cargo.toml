[workspace]
resolver = "2"
members = ["verify-stylesheet", "verify-image-urls", "contact-card", "components", "theme-client"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# The theme client is a few hundred bytes of logic; keep it that way.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
