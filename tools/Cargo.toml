[workspace]
resolver = "2"
members = ["verify-stylesheet", "verify-image-urls", "contact-card", "components", "nav-portrait", "components-wasm"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The WebAssembly build: small before fast, since it ships to a Worker.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
