<!-- @dsCard group="Chrome" height=220 subtitle="First in the tab order, hidden until focused" -->
<style>body{padding:24px;min-height:0;background:var(--sheet)}
.ds-states{display:grid;gap:18px}.ds-row{display:grid;grid-template-columns:128px 1fr;gap:16px;align-items:center}
.ds-cap{font-family:var(--mono);font-size:var(--label);font-weight:var(--label-weight);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft)}
.ds-wrap{position:relative}</style>
<div class="ds-states"><div class="ds-row"><span class="ds-cap">Hidden</span><div><div style="position:relative;height:60px;overflow:hidden"><a class="skip-link" href="#main">Skip to main content</a></div></div></div><div class="ds-row"><span class="ds-cap">Focused</span><div><div style="position:relative;height:60px;overflow:hidden"><a class="skip-link ds-focus" href="#main">Skip to main content</a></div></div></div></div>
