# pnpm 11+ no longer reads the "pnpm" field in package.json.
overrides:
  "sharp@<0.35.5": "^0.35.5"
  "undici@>=7.0.0 <7.30.1": "^7.30.1"
  "undici@>=8.0.0 <8.12.2": "^8.12.2"
  "zod@<4.6.6": "^4.6.6"

# pnpm 12 holds back versions published within the release-age window. These two
# are transitive and were published hours before the install. Pinned to the exact
# versions so later publishes still wait out the window; drop these once they age out.
minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20261116.1"
  - "@testing-library/user-event@14.6.12"
  - "@cloudflare/build-output-utils@1.0.0-rc.0"
  - "@cloudflare/config@1.0.0-rc.0"
  - "@cloudflare/runtime-types@0.1.29"
  - cf@1.0.0-rc.0
  - miniflare@5.20261116.0-beta

# Native binaries that need their postinstall to run.
allowBuilds:
  esbuild: true
  workerd: true
